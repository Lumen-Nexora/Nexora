services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ENV: development
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      DATABASE_URL: postgresql://nexora:password@postgres:5432/nexora?sslmode=disable
      REPLICA_DATABASE_URL: ${REPLICA_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-}
      REDIS_SENTINEL_ADDRS: ${REDIS_SENTINEL_ADDRS:-}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_USDC_ISSUER: ${STELLAR_USDC_ISSUER:-GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      PLATFORM_FEE_WALLET_PUBLIC_KEY: ${PLATFORM_FEE_WALLET_PUBLIC_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-mock}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-mock}
      ALERT_WEBHOOK_URL: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["./api"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot database migration. Runs `api -migrate-only` against a healthy
  # postgres before the api/worker start, so `docker compose up` always
  # boots onto the latest schema with no manual `make migrate` step.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://nexora:password@postgres:5432/nexora?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./api", "-migrate-only"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "${INDEXER_METRICS_PORT:-9090}:${INDEXER_METRICS_PORT:-9090}"
    environment:
      PORT: "3001"
      ENV: development
      INDEXER_STREAM_CONCURRENCY: ${INDEXER_STREAM_CONCURRENCY:-32}
      INDEXER_STREAM_MAX_WALLETS: ${INDEXER_STREAM_MAX_WALLETS:-32}
      INDEXER_STREAM_SHARD_COUNT: ${INDEXER_STREAM_SHARD_COUNT:-1}
      INDEXER_STREAM_SHARD_INDEX: ${INDEXER_STREAM_SHARD_INDEX:-0}
      INDEXER_METRICS_PORT: ${INDEXER_METRICS_PORT:-9090}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      DATABASE_URL: postgresql://nexora:password@postgres:5432/nexora?sslmode=disable
      REPLICA_DATABASE_URL: ${REPLICA_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-}
      REDIS_SENTINEL_ADDRS: ${REDIS_SENTINEL_ADDRS:-}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_USDC_ISSUER: ${STELLAR_USDC_ISSUER:-GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      PLATFORM_FEE_WALLET_PUBLIC_KEY: ${PLATFORM_FEE_WALLET_PUBLIC_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-mock}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-mock}
      ALERT_WEBHOOK_URL: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["./worker"]

volumes:
  pgdata:
  redisdata:
